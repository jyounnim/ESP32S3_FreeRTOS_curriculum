; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:rymcu-esp32-s3-devkitc-1]
;platform = espressif32
;board = rymcu-esp32-s3-devkitc-1
;framework = arduino

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_encoding = UTF-8

; ---- OTA 무선 업로드 설정 ----
;upload_protocol = espota
;upload_port = 172.30.1.72      ; 시리얼 모니터에서 확인한 실제 IP로 교체
; ArduinoOTA.setPassword()를 설정했다면 아래 주석 해제
; upload_flags = --auth=your-ota-password

; ---- N16R8 (16MB Quad Flash + 8MB Octal PSRAM)  ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ---- Add build flags (Enable PSRAM and speed optimaze)
build_flags = 
    -D CODE_DEBUG_LEVEL=5
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ---- Add library
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    knolleary/PubSubClient @ ^2.8
